name: P5 Open-World Free Probe Proof

on:
  push:
    branches:
      - p5-openworld-free-probe-20261002
    paths:
      - validation/p5_openworld_probe.py
      - .github/workflows/p5-openworld-free-probe.yml

permissions:
  contents: read

jobs:
  p5-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run P5 proof
        run: python3 validation/p5_openworld_probe.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-openworld-free-probe
          path: p5-openworld-probe-result.json
          if-no-files-found: warn
          retention-days: 7
