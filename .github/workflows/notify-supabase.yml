name: Notify Supabase Webhook

on:
  pull_request:
    types: [opened, closed, reopened, synchronize]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Forward event to Supabase
        env:
          SUPABASE_WEBHOOK_URL: https://kjtirbnxxymeumycrhqv.supabase.co/functions/v1/github-webhook
        run: |
          set -euo pipefail
          # Read the GitHub-provided event file instead of inserting untrusted
          # JSON into shell source. Apostrophes/newlines cannot break quoting.
          curl --fail-with-body --silent --show-error \
            --connect-timeout 5 --max-time 20 \
            -X POST "$SUPABASE_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "x-github-event: $GITHUB_EVENT_NAME" \
            -H "x-github-delivery: $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --data-binary "@$GITHUB_EVENT_PATH"
