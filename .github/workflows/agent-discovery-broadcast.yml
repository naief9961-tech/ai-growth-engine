name: NAIF Gravity Agent Discovery Broadcast

on:
  push:
    branches: [main]
    paths:
      - server.json
      - .github/workflows/agent-discovery-broadcast.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: naif-gravity-mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish-mcp:
    name: Validate and announce remote MCP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public discovery metadata
        uses: actions/checkout@v4

      - name: Install verified official MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output mcp-publisher.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz' | sha256sum --check
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod 755 mcp-publisher
          ./mcp-publisher --version

      - name: Validate manifest
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            set +e
            output=$(./mcp-publisher validate server.json 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            # Retry only transient upstream registry/network failures, never bad manifests.
            if ! grep -Eiq 'i/o timeout|context deadline exceeded|connection reset|HTTP 50[0234]|HTTP 429' <<< "$output"; then
              exit "$status"
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            echo "Transient MCP Registry validation error; retrying attempt $((attempt + 1))/3."
            sleep $((attempt * 5))
          done

      - name: Sign in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Broadcast release to official MCP Registry
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output=$(./mcp-publisher publish server.json 2>&1)
          status=$?
          set -e
          printf '%s\\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if grep -Fq 'invalid version: cannot publish duplicate version' <<< "$output"; then
            echo 'MCP Registry already contains this exact version; no re-publication needed.'
            exit 0
          fi
          exit "$status"
